<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة بناء: طيران الشارة بالقوس المكافئ (مستوحى من تقرير charla)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23314d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #10b981;
      --spring: cubic-bezier(0.3, 1.4, 0.45, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: clip;
      position: relative;
    }
    .chat-panel {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .header h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .status-badge {
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      font-family: monospace;
    }

    /* Messages Thread */
    .thread {
      min-height: 200px;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 4px;
    }
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      transition: transform 450ms cubic-bezier(0.2, 1, 0.3, 1);
      will-change: transform;
    }
    .msg-row.outgoing {
      align-self: flex-start;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }
    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      background: #1e293b;
      border: 1px solid var(--border);
      font-size: 0.88rem;
      line-height: 1.5;
      position: relative;
    }
    .msg-row.outgoing .msg-bubble {
      background: #0284c7;
      color: #fff;
      border-color: #0369a1;
      border-radius: 14px 14px 14px 4px;
    }
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
      justify-content: flex-end;
    }

    /* Fixed Flight Layer */
    .flight-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }
    .flying-badge {
      position: absolute;
      left: 0;
      top: 0;
      background: var(--success);
      color: #022c22;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      will-change: transform;
    }

    /* Bottom Quick Action Pills */
    .quick-shelf {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .shelf-label { font-size: 0.8rem; color: var(--muted); }
    .pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-pill {
      background: #0d1524;
      border: 1px solid var(--border);
      color: #e2e8f0;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms var(--spring);
    }
    .quick-pill:hover {
      border-color: var(--primary);
      background: #17233a;
    }
    .quick-pill:active { transform: scale(0.96); }

    /* SVG Double Checkmark with pathLength="1" */
    .visto-icon {
      width: 15px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .visto-path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 320ms cubic-bezier(0.65, 0, 0.35, 1);
    }
    .visto-path.done {
      stroke-dashoffset: 0;
    }
  </style>
</head>
<body>
  <div class="chat-panel">
    <div class="header">
      <h1>سجل العمليات (إعادة بناء من charla)</h1>
      <span class="status-badge">k: 230, c: 23</span>
    </div>

    <div class="thread" id="chat-thread">
      <div class="msg-row" data-id="1">
        <div class="msg-avatar">👤</div>
        <div class="msg-bubble">
          <p>مرحباً، أرجو اعتماد سند الصرف رقم #409 لصالح الدعم اللوجستي.</p>
          <div class="msg-meta">
            <span>14:02</span>
          </div>
        </div>
      </div>
    </div>

    <div class="quick-shelf">
      <span class="shelf-label">إجراءات الرد السريع (انقر لإطلاق الشارة في مسار قوسي):</span>
      <div class="pills-row" id="pills-container">
        <button class="quick-pill" id="pill-1" data-text="تم اعتماد السند بنجاح ✓">⚡ اعتماد السند</button>
        <button class="quick-pill" id="pill-2" data-text="مراجعة الفاتورة الضريبية مطلوبة">📑 طلب مراجعة</button>
        <button class="quick-pill" id="pill-3" data-text="تم إغلاق البلاغ وتوثيق القيد">🔒 إغلاق وتوثيق</button>
      </div>
    </div>
  </div>

  <!-- Dedicated Top Fixed Flight Layer -->
  <div class="flight-layer" id="flight-layer"></div>

  <script>
    /* 1. Spring solver for landing bounce (k=320, c=19 from report) */
    function solveSpring(k = 320, c = 19) {
      let x = 0, v = 0, dt = 1 / 120, pts = [0];
      for (let i = 0; i < 360; i++) {
        v += (k * (1 - x) - c * v) * dt;
        x += v * dt;
        if (i % 3 === 0) pts.push(x.toFixed(4));
        if (Math.abs(1 - x) < 0.0015 && Math.abs(v) < 0.01) break;
      }
      pts[pts.length - 1] = '1';
      return `linear(${pts.join(', ')})`;
    }
    const bounceEasing = solveSpring(320, 19);

    const thread = document.getElementById('chat-thread');
    const flightLayer = document.getElementById('flight-layer');
    const pills = document.querySelectorAll('.quick-pill');

    let busy = false;

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        if (busy) return;
        busy = true;

        const text = pill.dataset.text;
        const srcRect = pill.getBoundingClientRect();

        // 1. First measure old thread items for FLIP
        const oldRows = Array.from(thread.querySelectorAll('.msg-row'));
        const oldPositions = oldRows.map(r => r.getBoundingClientRect().top);

        // 2. Create the target bubble in the thread (initially invisible)
        const row = document.createElement('div');
        row.className = 'msg-row outgoing';
        row.style.opacity = '0';
        row.innerHTML = `
          <div class="msg-avatar" style="background:#0284c7; color:#fff;">✓</div>
          <div class="msg-bubble">
            <p>${text}</p>
            <div class="msg-meta">
              <span>الآن</span>
              <svg class="visto-icon" viewBox="0 0 16 12">
                <path class="visto-path" d="M1.4 6.5 4.5 9.6 10.8 2.8" pathLength="1"></path>
                <path class="visto-path" d="M7.2 8.4 8.4 9.6 14.7 2.8" pathLength="1"></path>
              </svg>
            </div>
          </div>
        `;
        thread.appendChild(row);

        // Measure new positions of old rows and apply FLIP spring
        const newPositions = oldRows.map(r => r.getBoundingClientRect().top);
        oldRows.forEach((r, idx) => {
          const dy = oldPositions[idx] - newPositions[idx];
          if (dy !== 0) {
            r.animate([
              { transform: `translateY(${dy}px)` },
              { transform: 'none' }
            ], { duration: 460, easing: 'cubic-bezier(0.2, 1, 0.3, 1)' });
          }
        });

        // Destination rect for flight
        const dstBubble = row.querySelector('.msg-bubble');
        const dstRect = dstBubble.getBoundingClientRect();

        // Coordinates
        const p1 = { x: srcRect.left + srcRect.width / 2, y: srcRect.top + srcRect.height / 2 };
        const p2 = { x: dstRect.left + dstRect.width / 2, y: dstRect.top + dstRect.height / 2 };

        // 3. Create Flight Element in the fixed flight layer
        const flightEl = document.createElement('div');
        flightEl.className = 'flying-badge';
        flightEl.textContent = pill.textContent;
        flightLayer.appendChild(flightEl);

        const duration = 480;
        const arcHeight = 46; // From report: -46px upward arc
        const startTime = performance.now();

        function step(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const x = p1.x + (p2.x - p1.x) * t;
          const y = p1.y + (p2.y - p1.y) * t - (4 * arcHeight * t * (1 - t));

          // Scale function from report: 1.25 + 0.35 * sin(PI * t) - scale down to target
          const scale = 1 + 0.28 * Math.sin(Math.PI * t);
          flightEl.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale})`;

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            // Arrival
            flightEl.remove();
            row.style.opacity = '1';

            // Spring landing bounce on target bubble (BROTA)
            dstBubble.animate([
              { transform: 'scale(0.85)' },
              { transform: 'scale(1.08)' },
              { transform: 'none' }
            ], { duration: 380, easing: bounceEasing });

            // Draw double checkmark paths (pathLength="1")
            const checkPaths = row.querySelectorAll('.visto-path');
            setTimeout(() => {
              checkPaths[0].classList.add('done');
              setTimeout(() => {
                checkPaths[1].classList.add('done');
                busy = false;
              }, 120);
            }, 80);

            thread.scrollTop = thread.scrollHeight;
          }
        }

        requestAnimationFrame(step);
      });
    });
  </script>
</body>
</html>

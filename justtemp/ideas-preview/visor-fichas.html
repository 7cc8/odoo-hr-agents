<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المُستَعرِض — توسعة البطاقات والطبقة البصرية</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e2640;
      --border: #2d3748;
      --text: #f7fafc;
      --muted: #a0aec0;
      --accent: #6366f1;
      --spring: cubic-bezier(0.2, 1.25, 0.4, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: clip;
    }
    .wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.15rem; font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      position: relative;
    }
    .card-slot {
      height: 130px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed #2d3748;
      border-radius: 12px;
      position: relative;
    }
    .card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: transform 300ms var(--spring), opacity 250ms ease, box-shadow 200ms ease;
    }
    .card:hover {
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
      border-color: #4f46e5;
    }
    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #818cf8;
    }
    .card-title { font-size: 0.88rem; font-weight: 600; }
    .card-meta { font-size: 0.72rem; color: var(--muted); }

    /* Sinking inactive siblings */
    .grid.is-inspecting .card:not(.selected) {
      transform: scale(0.9) translateY(10px);
      opacity: 0.25;
      pointer-events: none;
    }

    /* Modal Viewer Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 280ms ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      width: 90%;
      max-width: 440px;
      min-height: 280px;
      background: #1e2640;
      border: 1px solid #4f46e5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      clip-path: circle(0% at center);
      transition: clip-path 450ms var(--spring);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .modal-overlay.active .modal-box {
      clip-path: circle(150% at center);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, transform 150ms var(--spring);
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .close-btn:active { transform: scale(0.92); }
    .modal-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .modal-stats {
      display: flex;
      gap: 12px;
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>المُستَعرِض — لوحة فحص المخططات الفنية</h1>
      <span style="font-size:0.8rem; color:var(--muted)">اختر بطاقة للتوسعة والتفصيل</span>
    </div>

    <div class="grid" id="grid">
      <!-- Card 1 -->
      <div class="card-slot">
        <div class="card" data-id="1" data-title="المخطط الهيكلي A" data-desc="تحليل الأحمال والتوزيع الفضائي للكتل المعمارية مع تدقيق عوامل الأمان الإنشائي.">
          <div class="card-icon">📐</div>
          <div class="card-title">المخطط الهيكلي A</div>
          <div class="card-meta">تحديث: منذ ساعتين</div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card-slot">
        <div class="card" data-id="2" data-title="شبكة الإمداد B" data-desc="مخطط التوزيع الهيدروليكي وشبكات التبريد المركزي المطابقة لكود البناء الحديث.">
          <div class="card-icon">⚡</div>
          <div class="card-title">شبكة الإمداد B</div>
          <div class="card-meta">تحديث: أمس</div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card-slot">
        <div class="card" data-id="3" data-title="مسار الإخلاء C" data-desc="دراسة مسارات الطوارئ والأبواب الذاتية الغلق ومستشعرات الدخان الذكية.">
          <div class="card-icon">🛡️</div>
          <div class="card-title">مسار الإخلاء C</div>
          <div class="card-meta">تحديث: منذ 3 أيام</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Overlay with Circular Clip-Path -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <span id="modal-icon" style="font-size:1.3rem">📐</span>
          <h2 id="modal-title" style="font-size:1.05rem;">عنوان المخطط</h2>
        </div>
        <button class="close-btn" id="close-btn" aria-label="إغلاق">✕</button>
      </div>
      <p class="modal-desc" id="modal-desc">تفاصيل المخطط تظهر هنا بشكل مفصل وشامل.</p>
      <div class="modal-stats">
        <span>الحالة: ساري المفعول</span>
        <span>الاعتماد: المهندس الرئيسي</span>
      </div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const cards = document.querySelectorAll('.card');
    const modal = document.getElementById('modal');
    const modalBox = document.getElementById('modal-box');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalIcon = document.getElementById('modal-icon');
    const closeBtn = document.getElementById('close-btn');

    let activeCard = null;

    cards.forEach((card, index) => {
      card.addEventListener('click', () => {
        activeCard = card;
        const clickedIdx = index;

        // Apply distance stagger to siblings
        cards.forEach((other, oIdx) => {
          const distance = Math.abs(oIdx - clickedIdx);
          other.style.transitionDelay = `${distance * 45}ms`;
        });

        grid.classList.add('is-inspecting');
        card.classList.add('selected');

        // Populate modal data
        modalTitle.textContent = card.dataset.title;
        modalDesc.textContent = card.dataset.desc;
        modalIcon.textContent = card.querySelector('.card-icon').textContent;

        // Open modal
        modal.classList.add('active');
      });
    });

    function closeModal() {
      modal.classList.remove('active');
      setTimeout(() => {
        grid.classList.remove('is-inspecting');
        if (activeCard) {
          activeCard.classList.remove('selected');
          activeCard = null;
        }
        cards.forEach(c => c.style.transitionDelay = '0ms');
      }, 200);
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>

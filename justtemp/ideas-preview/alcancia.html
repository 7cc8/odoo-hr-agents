<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحافِظَة — موازنة الادخار والتحول الشكلي</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --gold: #f59e0b;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .stash-box {
      width: 440px;
      min-height: 260px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      transition: all 550ms var(--spring);
      position: relative;
    }
    /* Morphed floating state */
    .stash-box.morphed {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 58px;
      height: 58px;
      min-height: 58px;
      border-radius: 50%;
      padding: 0;
      border-color: var(--gold);
      background: #78350f;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
      cursor: pointer;
    }
    .stash-box.morphed .inner-content {
      display: none;
    }
    .floating-icon {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .stash-box.morphed .floating-icon {
      display: flex;
    }

    .header h2 { font-size: 1.15rem; }
    .header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    .amount-display {
      margin: 16px 0;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .btn-save {
      background: #d97706;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 150ms ease, transform 150ms var(--spring);
    }
    .btn-save:hover { background: #b45309; }
    .btn-save:active { transform: scale(0.96); }

    /* Particles Canvas Overlay */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div class="stash-box" id="stash-card">
    <div class="inner-content">
      <div class="header">
        <h2>الحافِظَة — موازنة الادخار الذكي</h2>
        <p>اقتطاع مخصص يُحفظ فورياً مع التحول الشكلي</p>
      </div>

      <div class="amount-display">1,250.00 ر.س</div>

      <button class="btn-save" id="commit-btn">اعتماد الخطة وإيداع الحصالة</button>
    </div>

    <div class="floating-icon" title="انقر للفتح">🪙</div>
  </div>

  <script>
    const stashCard = document.getElementById('stash-card');
    const commitBtn = document.getElementById('commit-btn');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let particles = [];

    function spawnParticles(originX, originY) {
      particles = [];
      const count = 18;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 8;
        particles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          radius: 3 + Math.random() * 3,
          alpha: 1,
          gravity: 0.32
        });
      }
      animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      for (const p of particles) {
        if (p.alpha > 0.02) {
          alive = true;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.alpha *= 0.94;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(245, 158, 11, ${p.alpha})`;
          ctx.fill();
        }
      }
      if (alive) requestAnimationFrame(animateParticles);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    commitBtn.addEventListener('click', (e) => {
      const rect = stashCard.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
      stashCard.classList.add('morphed');
    });

    stashCard.addEventListener('click', (e) => {
      if (stashCard.classList.contains('morphed')) {
        stashCard.classList.remove('morphed');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السِّجِلّ — اعتماد العمليات والوسم القوسي</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #10b981;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: clip;
      position: relative;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .header h2 { font-size: 1.1rem; font-weight: 600; }
    .status-badge {
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #334155;
      color: var(--muted);
    }
    
    /* Transaction Card */
    .record-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      transition: border-color 200ms ease;
    }
    .record-card.verified {
      border-color: var(--success);
    }
    .record-info { display: flex; flex-direction: column; gap: 4px; }
    .record-num { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .record-title { font-weight: 600; font-size: 0.98rem; }
    .record-amount { font-size: 1.1rem; font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; }

    .target-slot {
      min-width: 110px;
      height: 36px;
      border: 1px dashed var(--border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      color: var(--muted);
      position: relative;
      transition: transform 250ms var(--spring), background 200ms ease;
    }
    .target-slot.has-stamp {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
      font-weight: 600;
    }
    .target-slot.bounce {
      transform: scale(1.12);
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .stamp-source-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 150ms ease, transform 150ms var(--spring);
    }
    .stamp-source-btn:hover { background: #0369a1; }
    .stamp-source-btn:active { transform: scale(0.96); }
    .stamp-source-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    /* Flight Layer */
    .flight-pill {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      background: var(--success);
      color: #042f2e;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      will-change: transform;
    }

    /* SVG Double Check */
    .check-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      margin-left: 4px;
    }
    .check-path {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset 300ms ease;
    }
    .target-slot.has-stamp .check-path {
      stroke-dashoffset: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>السِّجِلّ — اعتماد القيود المالية</h2>
      <span class="status-badge" id="status-tag">في الانتظار</span>
    </div>

    <div class="record-card" id="record-card">
      <div class="record-info">
        <span class="record-num">عملية قيد #TX-8924</span>
        <span class="record-title">صرف مستحقات التدريب المهني</span>
        <span class="record-amount">4,850.00 ر.س</span>
      </div>
      <div class="target-slot" id="target-slot">
        <svg class="check-icon" viewBox="0 0 24 24">
          <polyline class="check-path" points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="slot-text">موضع الختم</span>
      </div>
    </div>

    <div class="actions-bar">
      <button class="stamp-source-btn" id="stamp-btn">
        <span>إطلاق ختم الاعتماد</span>
        <span style="font-size:1.1rem">⚡</span>
      </button>
      <button class="reset-btn" id="reset-btn">إعادة التهيئة</button>
    </div>
  </div>

  <script>
    const stampBtn = document.getElementById('stamp-btn');
    const resetBtn = document.getElementById('reset-btn');
    const targetSlot = document.getElementById('target-slot');
    const recordCard = document.getElementById('record-card');
    const slotText = document.getElementById('slot-text');
    const statusTag = document.getElementById('status-tag');

    let animating = false;

    stampBtn.addEventListener('click', () => {
      if (animating || targetSlot.classList.contains('has-stamp')) return;
      animating = true;
      stampBtn.disabled = true;

      const srcRect = stampBtn.getBoundingClientRect();
      const dstRect = targetSlot.getBoundingClientRect();

      const startX = srcRect.left + srcRect.width / 2;
      const startY = srcRect.top + srcRect.height / 2;
      const endX = dstRect.left + dstRect.width / 2;
      const endY = dstRect.top + dstRect.height / 2;

      // Create flight element
      const pill = document.createElement('div');
      pill.className = 'flight-pill';
      pill.textContent = 'معتمد ✓';
      document.body.appendChild(pill);

      const duration = 520;
      const arcHeight = 90; // parabolic arc upward
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Ease in-out
        const t = progress;
        // Current position
        const currentX = startX + (endX - startX) * t;
        // Parabolic equation: linear interpolation minus arc curve
        const currentY = startY + (endY - startY) * t - (4 * arcHeight * t * (1 - t));
        const scale = 1 + 0.18 * Math.sin(Math.PI * t);
        const rotation = (t - 0.5) * -16;

        pill.style.transform = `translate(${currentX}px, ${currentY}px) translate(-50%, -50%) scale(${scale}) rotate(${rotation}deg)`;

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          // Arrived
          pill.remove();
          targetSlot.classList.add('has-stamp', 'bounce');
          recordCard.classList.add('verified');
          slotText.textContent = 'معتمد رسمياً';
          statusTag.textContent = 'مكتمل وموثّق';
          statusTag.style.color = 'var(--success)';

          setTimeout(() => {
            targetSlot.classList.remove('bounce');
            animating = false;
          }, 260);
        }
      }

      requestAnimationFrame(step);
    });

    resetBtn.addEventListener('click', () => {
      targetSlot.classList.remove('has-stamp', 'bounce');
      recordCard.classList.remove('verified');
      slotText.textContent = 'موضع الختم';
      statusTag.textContent = 'في الانتظار';
      statusTag.style.color = 'var(--muted)';
      stampBtn.disabled = false;
      animating = false;
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شات سِراج | LangGraph Chat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-obsidian: #121212;
        --color-ash: #181818;
        --color-card: #202020;
        --color-charcoal: #2e2e2e;
        --color-slate: #393939;
        --color-snow: #fafafa;
        --color-silver: #b4b4b4;
        --color-smoke: #898989;
        --color-green: #3ecf8e;
        --color-blue: #38bdf8;
        --color-amber: #ffca16;
        --color-coral: #ff6465;
        --font-arabic: "IBM Plex Sans Arabic", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-arabic);
        background: var(--color-obsidian);
        color: var(--color-snow);
        height: 100vh;
        display: flex;
        flex-direction: column;
        direction: rtl;
      }

      /* Header */
      .header {
        background: var(--color-ash);
        border-bottom: 1px solid var(--color-charcoal);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--color-snow);
        text-decoration: none;
      }

      .logo-icon {
        width: 38px;
        height: 38px;
        background: var(--color-card);
        border: 1px solid var(--color-charcoal);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .logo-text {
        font-size: 18px;
        font-weight: 700;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(62, 207, 142, 0.1);
        border: 1px solid rgba(62, 207, 142, 0.3);
        color: var(--color-green);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--color-green);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Chat Container */
      .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Message Bubbles */
      .message {
        display: flex;
        gap: 12px;
        max-width: 85%;
        animation: slideIn 0.2s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        align-self: flex-start;
      }

      .message.assistant {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--color-card);
        border: 1px solid var(--color-charcoal);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 18px;
      }

      .message.user .avatar {
        background: #232323;
      }

      .message.assistant .avatar {
        background: rgba(56, 189, 248, 0.1);
        border-color: var(--color-blue);
        color: var(--color-blue);
      }

      .message-content {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .message-meta {
        font-size: 11px;
        color: var(--color-smoke);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .message-bubble {
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.6;
      }

      .message.user .message-bubble {
        background: #232323;
        border: 1px solid var(--color-charcoal);
        color: var(--color-snow);
      }

      .message.assistant .message-bubble {
        background: var(--color-ash);
        border: 1px solid var(--color-charcoal);
        border-right: 3px solid var(--color-blue);
        color: var(--color-snow);
      }

      .message-bubble pre,
      .message-bubble code {
        font-family: var(--font-mono);
        background: #141414;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        direction: ltr;
      }

      .message-bubble pre {
        display: block;
        padding: 10px;
        margin: 8px 0;
        overflow-x: auto;
      }

      /* Typing Indicator */
      .typing-indicator {
        display: none;
        align-items: center;
        gap: 12px;
        max-width: 85%;
        align-self: flex-end;
      }

      .typing-indicator.active {
        display: flex;
      }

      .typing-dots {
        display: flex;
        gap: 5px;
        padding: 12px 16px;
        background: var(--color-ash);
        border: 1px solid var(--color-charcoal);
        border-radius: 12px;
        border-right: 3px solid var(--color-blue);
      }

      .typing-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-smoke);
        animation: typing 1.4s ease-in-out infinite;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
          background: var(--color-smoke);
        }
        30% {
          transform: translateY(-6px);
          background: var(--color-blue);
        }
      }

      /* Input Area */
      .input-area {
        border-top: 1px solid var(--color-charcoal);
        padding: 16px 24px;
        background: var(--color-ash);
      }

      .input-form {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        max-width: 1200px;
        margin: 0 auto;
      }

      .input-wrapper {
        flex: 1;
        position: relative;
      }

      /* File Upload */
      .file-input {
        display: none;
      }

      .file-upload-btn {
        padding: 10px 12px;
        background: var(--color-ash);
        border: 1px solid var(--color-charcoal);
        border-radius: 10px;
        color: var(--color-silver);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .file-upload-btn:hover {
        color: var(--color-snow);
        border-color: var(--color-slate);
        background: var(--color-card);
      }

      .file-upload-btn svg {
        width: 18px;
        height: 18px;
      }

      .file-preview {
        display: none;
        background: rgba(62, 207, 142, 0.1);
        border: 1px solid rgba(62, 207, 142, 0.3);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 10px;
        align-items: center;
        gap: 10px;
      }

      .file-preview.active {
        display: flex;
      }

      .file-icon {
        width: 32px;
        height: 32px;
        background: var(--color-green);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .file-info {
        flex: 1;
      }

      .file-name {
        font-size: 13px;
        color: var(--color-snow);
        font-weight: 500;
      }

      .file-size {
        font-size: 11px;
        color: var(--color-smoke);
      }

      .file-remove {
        background: transparent;
        border: none;
        color: var(--color-coral);
        cursor: pointer;
        font-size: 18px;
        padding: 4px 8px;
        line-height: 1;
      }

      .file-remove:hover {
        color: #ff4444;
      }

      .input-field {
        width: 100%;
        min-height: 48px;
        max-height: 120px;
        background: var(--color-card);
        border: 1px solid var(--color-slate);
        border-radius: 12px;
        color: var(--color-snow);
        font-family: var(--font-arabic);
        font-size: 14px;
        padding: 12px 16px;
        resize: none;
        outline: none;
        transition: border-color 0.2s;
      }

      .input-field:focus {
        border-color: var(--color-green);
      }

      .send-btn {
        padding: 12px 24px;
        background: var(--color-green);
        color: #121212;
        border: none;
        border-radius: 12px;
        font-family: var(--font-arabic);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .send-btn:hover:not(:disabled) {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Error Message */
      .error-message {
        background: rgba(255, 100, 101, 0.1);
        border: 1px solid rgba(255, 100, 101, 0.3);
        border-radius: 12px;
        padding: 12px 16px;
        color: var(--color-coral);
        font-size: 13px;
        margin: 12px 24px;
        display: none;
      }

      .error-message.active {
        display: block;
      }

      /* Agent Badge */
      .agent-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: var(--color-blue);
      }

      /* Scrollbar */
      .messages-area::-webkit-scrollbar {
        width: 8px;
      }

      .messages-area::-webkit-scrollbar-track {
        background: var(--color-ash);
      }

      .messages-area::-webkit-scrollbar-thumb {
        background: var(--color-charcoal);
        border-radius: 4px;
      }

      .messages-area::-webkit-scrollbar-thumb:hover {
        background: var(--color-slate);
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <a href="/" class="logo">
        <div class="logo-icon">💬</div>
        <div class="logo-text">شات سِراج</div>
      </a>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="status-text">متصل</span>
      </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container">
      <div class="messages-area" id="messages"></div>

      <!-- Typing Indicator -->
      <div class="typing-indicator" id="typing">
        <div class="avatar">🤖</div>
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="error"></div>

    <!-- Input Area -->
    <div class="input-area">
      <form class="input-form" id="chat-form">
        <div class="input-wrapper">
          <textarea
            class="input-field"
            id="user-input"
            placeholder="اكتب رسالتك هنا..."
            rows="1"
          ></textarea>
        </div>
        <button type="submit" class="send-btn" id="send-btn">
          <span>إرسال</span>
          <span>⬅️</span>
        </button>
      </form>
    </div>

    <script>
      // Global State
      let threadId = `thread_${Date.now()}`;
      let currentAgent = "seraj";

      // DOM Elements
      const messagesArea = document.getElementById("messages");
      const chatForm = document.getElementById("chat-form");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const typingIndicator = document.getElementById("typing");
      const errorMessage = document.getElementById("error");
      const statusText = document.getElementById("status-text");

      // Auto-resize textarea
      userInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 120) + "px";
      });

      // Handle Enter key (Shift+Enter for new line)
      userInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          chatForm.dispatchEvent(new Event("submit"));
        }
      });

      // Add message to chat
      function addMessage(role, content, metadata = {}) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role}`;

        const avatar = role === "user" ? "👤" : "🤖";
        const agentBadge = metadata.agent
          ? `<span class="agent-badge">${metadata.agent}</span>`
          : "";

        const timestamp = new Date().toLocaleTimeString("ar-SA", {
          hour: "2-digit",
          minute: "2-digit",
        });

        messageDiv.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="message-content">
          <div class="message-meta">
            ${agentBadge}
            <span>${timestamp}</span>
          </div>
          <div class="message-bubble">${formatMessage(content)}</div>
        </div>
      `;

        messagesArea.appendChild(messageDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      // Format message content
      function formatMessage(content) {
        // Convert markdown-style code blocks
        content = content.replace(
          /```(\w*)\n([\s\S]*?)```/g,
          "<pre><code>$2</code></pre>",
        );
        // Convert inline code
        content = content.replace(/`([^`]+)`/g, "<code>$1</code>");
        // Convert line breaks
        content = content.replace(/\n/g, "<br>");
        return content;
      }

      // Show/hide typing indicator
      function setTyping(show) {
        typingIndicator.classList.toggle("active", show);
        if (show) {
          messagesArea.scrollTop = messagesArea.scrollHeight;
        }
      }

      // Show error
      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("active");
        setTimeout(() => {
          errorMessage.classList.remove("active");
        }, 5000);
      }

      // Update status
      function setStatus(status, text) {
        statusText.textContent = text;
        const badge = statusText.closest(".status-badge");
        badge.style.background =
          status === "connected"
            ? "rgba(62, 207, 142, 0.1)"
            : "rgba(255, 202, 22, 0.1)";
        badge.style.borderColor =
          status === "connected"
            ? "rgba(62, 207, 142, 0.3)"
            : "rgba(255, 202, 22, 0.3)";
        badge.style.color =
          status === "connected" ? "var(--color-green)" : "var(--color-amber)";
      }

      // Send message to API
      async function sendMessage(message) {
        try {
          setTyping(true);
          sendBtn.disabled = true;

          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: message,
              thread_id: threadId,
            }),
          });

          if (!response.ok) {
            throw new Error(`خطأ في الاتصال: ${response.status}`);
          }

          const data = await response.json();

          // Update current agent
          currentAgent = data.current_agent || "seraj";

          // Extract response text
          let responseText = "";
          if (data.response && typeof data.response === "object") {
            responseText =
              data.response.content ||
              data.response.text ||
              JSON.stringify(data.response, null, 2);
          } else if (data.response) {
            responseText = String(data.response);
          } else {
            responseText = "تم معالجة طلبك بنجاح.";
          }

          // Add assistant message
          addMessage("assistant", responseText, { agent: currentAgent });

          setStatus("connected", "متصل");
        } catch (error) {
          console.error("Error:", error);
          showError(`حدث خطأ: ${error.message}`);
          setStatus("error", "خطأ في الاتصال");

          // Add error message to chat
          addMessage(
            "assistant",
            `⚠️ عذراً، حدث خطأ في معالجة رسالتك: ${error.message}`,
            {},
          );
        } finally {
          setTyping(false);
          sendBtn.disabled = false;
        }
      }

      // Handle form submission
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const message = userInput.value.trim();
        if (!message) return;

        // Add user message to chat
        addMessage("user", message);

        // Clear input
        userInput.value = "";
        userInput.style.height = "auto";

        // Send to API
        await sendMessage(message);
      });

      // Initial greeting
      window.addEventListener("load", () => {
        addMessage(
          "assistant",
          "مرحباً! 👋 أنا سِراج، مساعدك الذكي لإدارة الموارد البشرية في Odoo.\n\nكيف يمكنني مساعدتك اليوم؟",
          { agent: "seraj" },
        );
      });

      // Check connection status periodically
      setInterval(async () => {
        try {
          const response = await fetch("/api/status");
          if (response.ok) {
            setStatus("connected", "متصل");
          } else {
            setStatus("disconnected", "غير متصل");
          }
        } catch (error) {
          setStatus("disconnected", "غير متصل");
        }
      }, 30000); // Every 30 seconds
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعداد الموظفين والمنشآت · Diagram Design Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #121212;
      --color-paper-2: #1a1a1a;
      --color-card: #202020;
      --color-ink: #f5f5f5;
      --color-muted: #bfc0c0;
      --color-soft: #8e98ac;
      --color-rule: rgba(245, 245, 245, 0.12);
      --color-accent: #3ecf8e;
      --color-accent-tangerine: #eb6c36;
      --font-arabic: 'IBM Plex Sans Arabic', -apple-system, sans-serif;
      --font-sans: 'Geist', var(--font-arabic), sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-arabic);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      direction: rtl;
    }
    .frame {
      max-width: 960px;
      width: 100%;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 10px;
      padding: 2rem;
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-soft);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eyebrow-tag {
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--color-rule);
      border-radius: 3px;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
      margin-bottom: 0.4rem;
      color: var(--color-ink);
    }
    .subtitle {
      color: var(--color-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .diagram-wrap {
      overflow-x: auto;
    }
    svg {
      width: 100%;
      min-width: 780px;
      display: block;
      background: #161616;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">
      <span class="eyebrow-tag">ODOO HR · CENSUS</span>
      <span>DIAGRAM DESIGN EDITORIAL</span>
    </div>
    <h1>توزيع الكيانات وتعداد الموظفين النشطين في Odoo</h1>
    <p class="subtitle">استعلام قراءة فوري عبر «فاحص» لخادم قاعدة البيانات edu-training1555.odoo.com عبر 5 منشآت معتمدة.</p>

    <div class="diagram-wrap">
      <svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="census-title census-desc">
        <title id="census-title">توزيع الكيانات وتعداد الموظفين</title>
        <desc id="census-desc">مخطط بياني هيكلي يوضح عدد الموظفين في كل شركة من شركات Odoo الخمس مع تمييز المنشأة النشطة.</desc>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#161616"/>

        <!-- Header Columns -->
        <rect x="20" y="24" width="70" height="34" rx="4" fill="#202020" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <text x="55" y="45" fill="#bfc0c0" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" text-anchor="middle">المعرّف</text>

        <rect x="100" y="24" width="360" height="34" rx="4" fill="#202020" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <text x="440" y="45" fill="#bfc0c0" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" text-anchor="end">اسم المنشأة / الفرع</text>

        <rect x="470" y="24" width="220" height="34" rx="4" fill="#202020" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <text x="580" y="45" fill="#bfc0c0" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" text-anchor="middle">المقياس البصري</text>

        <rect x="700" y="24" width="120" height="34" rx="4" fill="#202020" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <text x="760" y="45" fill="#bfc0c0" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" text-anchor="middle">التعداد</text>

        <!-- Hairline below headers -->
        <line x1="20" y1="70" x2="820" y2="70" stroke="rgba(245,245,245,0.14)" stroke-width="0.8"/>

        <!-- Row 1: edu-training1555 (FOCAL ROW - 1 Employee) -->
        <g id="row-1">
          <rect x="20" y="80" width="800" height="52" rx="6" fill="rgba(62,207,142,0.06)" stroke="rgba(62,207,142,0.30)" stroke-width="1"/>
          
          <!-- ID Tag -->
          <rect x="35" y="93" width="40" height="24" rx="3" fill="rgba(62,207,142,0.12)" stroke="rgba(62,207,142,0.40)" stroke-width="0.8"/>
          <text x="55" y="109" fill="#3ecf8e" font-size="12" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">#1</text>

          <!-- Company Name -->
          <text x="440" y="105" fill="#ffffff" font-size="13" font-family="'Geist', sans-serif" font-weight="600" text-anchor="end">edu-training1555</text>
          <text x="440" y="122" fill="#3ecf8e" font-size="10" font-family="'IBM Plex Sans Arabic', sans-serif" text-anchor="end">المنشأة الرئيسية النشطة • قاعدة البيانات الأساسية</text>

          <!-- Visual Bar Track -->
          <rect x="490" y="101" width="180" height="10" rx="5" fill="#252525"/>
          <rect x="490" y="101" width="180" height="10" rx="5" fill="#3ecf8e"/>

          <!-- Headcount Badge -->
          <rect x="715" y="93" width="90" height="26" rx="4" fill="rgba(62,207,142,0.15)" stroke="rgba(62,207,142,0.45)" stroke-width="0.8"/>
          <circle cx="790" cy="106" r="3.5" fill="#3ecf8e"/>
          <text x="752" y="110" fill="#3ecf8e" font-size="11.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="700" text-anchor="middle">1 موظف</text>
        </g>

        <!-- Row 2: القهوة السرايا (0 Employees) -->
        <g id="row-2">
          <rect x="20" y="140" width="800" height="46" rx="6" fill="#1b1b1b" stroke="rgba(245,245,245,0.06)" stroke-width="0.8"/>
          <rect x="35" y="151" width="40" height="22" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
          <text x="55" y="166" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">#2</text>
          <text x="440" y="168" fill="#f5f5f5" font-size="13" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="500" text-anchor="end">القهوة السرايا</text>
          <rect x="490" y="158" width="180" height="8" rx="4" fill="#252525"/>
          <rect x="715" y="151" width="90" height="24" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
          <circle cx="790" cy="163" r="3" fill="#5c5c5c"/>
          <text x="752" y="167" fill="#8e98ac" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" text-anchor="middle">0 موظفين</text>
        </g>

        <!-- Row 3: فرع حراء (0 Employees) -->
        <g id="row-3">
          <rect x="20" y="194" width="800" height="46" rx="6" fill="#1b1b1b" stroke="rgba(245,245,245,0.06)" stroke-width="0.8"/>
          <rect x="35" y="205" width="40" height="22" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
          <text x="55" y="220" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">#3</text>
          <text x="440" y="222" fill="#f5f5f5" font-size="13" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="500" text-anchor="end">فرع حراء</text>
          <rect x="490" y="212" width="180" height="8" rx="4" fill="#252525"/>
          <rect x="715" y="205" width="90" height="24" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
          <circle cx="790" cy="217" r="3" fill="#5c5c5c"/>
          <text x="752" y="221" fill="#8e98ac" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" text-anchor="middle">0 موظفين</text>
        </g>

        <!-- Row 4: فرع الروضة (0 Employees) -->
        <g id="row-4">
          <rect x="20" y="248" width="800" height="46" rx="6" fill="#1b1b1b" stroke="rgba(245,245,245,0.06)" stroke-width="0.8"/>
          <rect x="35" y="259" width="40" height="22" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
          <text x="55" y="274" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">#4</text>
          <text x="440" y="276" fill="#f5f5f5" font-size="13" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="500" text-anchor="end">فرع الروضة</text>
          <rect x="490" y="266" width="180" height="8" rx="4" fill="#252525"/>
          <rect x="715" y="259" width="90" height="24" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
          <circle cx="790" cy="271" r="3" fill="#5c5c5c"/>
          <text x="752" y="275" fill="#8e98ac" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" text-anchor="middle">0 موظفين</text>
        </g>

        <!-- Row 5: فرع الرياض (0 Employees) -->
        <g id="row-5">
          <rect x="20" y="302" width="800" height="46" rx="6" fill="#1b1b1b" stroke="rgba(245,245,245,0.06)" stroke-width="0.8"/>
          <rect x="35" y="313" width="40" height="22" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
          <text x="55" y="328" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">#5</text>
          <text x="440" y="330" fill="#f5f5f5" font-size="13" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="500" text-anchor="end">فرع الرياض</text>
          <rect x="490" y="320" width="180" height="8" rx="4" fill="#252525"/>
          <rect x="715" y="313" width="90" height="24" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
          <circle cx="790" cy="325" r="3" fill="#5c5c5c"/>
          <text x="752" y="329" fill="#8e98ac" font-size="11" font-family="'IBM Plex Sans Arabic', sans-serif" text-anchor="middle">0 موظفين</text>
        </g>

        <!-- Legend / Colophon Footer Strip -->
        <line x1="20" y1="366" x2="820" y2="366" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="35" y="392" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <circle cx="110" cy="389" r="3.5" fill="#3ecf8e"/>
        <text x="122" y="393" fill="#bfc0c0" font-size="10.5" font-family="'IBM Plex Sans Arabic', sans-serif">منشأة نشطة وبها موظفون</text>
        
        <circle cx="260" cy="389" r="3" fill="#5c5c5c"/>
        <text x="272" y="393" fill="#8e98ac" font-size="10.5" font-family="'IBM Plex Sans Arabic', sans-serif">منشأة بدون موظفين مسجلين</text>

        <text x="805" y="393" fill="#8e98ac" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="end">TOTAL: 5 ENTITIES • 1 EMPLOYEE</text>
      </svg>
    </div>
  </div>
</body>
</html>
